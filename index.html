<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球机场航线搜索</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        /* 页面容器 */
        .page {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .page.active {
            display: flex;
        }

        /* 搜索页面 */
        #searchPage {
            position: relative;
            flex: 1;
        }

        #searchMap {
            flex: 1;
            width: 100%;
            min-height: 100vh;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .map-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .map-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .search-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
        }

        .search-card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .input-group input:focus {
            border-color: rgba(102, 126, 234, 0.4);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        .search-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .search-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .input-row.destination {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #e0e0e0;
        }

        /* 结果页面 */
        #resultPage {
            flex-direction: column;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .result-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px 20px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .result-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .airport-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .airport-tag.origin {
            color: #1d4ed8;
        }

        .airport-tag.origin i {
            color: #3b82f6;
        }

        .airport-tag.destination {
            color: #166534;
        }

        .airport-tag.destination i {
            color: #22c55e;
        }

        .airport-tag i {
            font-size: 16px;
        }

        .route-arrow {
            color: #999;
            font-size: 18px;
        }

        #resultMap {
            flex: 1;
            min-height: 250px;
        }

        /* Tab 导航 */
        .tabs-container {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
            z-index: 15;
        }

        .tabs {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tab {
            flex: 1;
            min-width: 120px;
            padding: 14px 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: #f8f9ff;
        }

        .tab:hover {
            background: #f5f5f5;
        }

        /* Tab 内容 */
        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* 航线表格 */
        .routes-table-wrapper {
            padding: 15px;
        }

        .routes-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .routes-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .routes-table th {
            background: rgba(248, 249, 250, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .routes-table td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 13px;
        }

        .routes-table tr:hover {
            background: #fafafa;
        }

        .routes-table tr:last-child td {
            border-bottom: none;
        }

        .route-airport {
            font-weight: 600;
            color: #333;
        }

        .route-airport span {
            font-weight: normal;
            color: #999;
            font-size: 11px;
            display: block;
        }

        .route-distance {
            color: #1e88e5;
            font-weight: 500;
        }

        .route-location {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            font-style: italic;
        }

        /* PC端隐藏移动端布局 */
        .mobile-route-list {
            display: none;
        }

        .route-price {
            text-align: right;
        }

        .price-value {
            font-size: 16px;
            font-weight: 600;
            color: #f44336;
        }

        .price-hint {
            display: block;
            font-size: 11px;
            color: #999;
            font-weight: normal;
        }

        /* 评分显示 */
        .score-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-value {
            font-size: 18px;
            font-weight: bold;
            color: #e65100;
        }

        .star-rating {
            display: flex;
            gap: 1px;
        }

        .star-rating .star {
            font-size: 12px;
            color: #ddd;
        }

        .star-rating .star.filled {
            color: #ffc107;
        }

        .view-all-btn {
            width: calc(100% - 30px);
            margin: 15px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #6366f1;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .view-all-btn:hover {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* 机场列表 */
        .airport-list-wrapper {
            padding: 15px;
        }

        .airport-item {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .airport-item.origin {
            border-left: 4px solid #42a5f5;
        }

        .airport-item.destination {
            border-left: 4px solid #66bb6a;
        }

        .airport-info h4 {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }

        .airport-info p {
            font-size: 12px;
            color: #999;
        }

        .airport-distance {
            text-align: right;
        }

        .distance-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .distance-unit {
            font-size: 12px;
            color: #999;
        }

        /* 评分详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-height: 80vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            padding: 0;
            overflow-y: auto;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .modal-tabs {
            display: flex;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .modal-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .modal-tab.active {
            color: #4a90d9;
        }

        .modal-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: #4a90d9;
        }

        #detailContent {
            padding: 20px 25px;
            flex: 1;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0f0f0;
            border: none;
            font-size: 20px;
            color: #666;
            cursor: pointer;
        }

        .score-detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .score-detail-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .score-detail-item .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }

        .score-detail-item .value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .score-detail-item .desc {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .lcc-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 5px;
        }

        .lcc-badge.yes {
            background: #4caf50;
            color: white;
        }

        .lcc-badge.no {
            background: #e0e0e0;
            color: #999;
        }

        .score-summary {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            margin-top: 15px;
            padding: 20px;
            border-radius: 12px;
        }

        .score-summary .value {
            font-size: 28px;
            font-weight: bold;
            color: #e65100;
        }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #c62828;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 3000;
            box-shadow: 0 4px 20px rgba(198, 40, 40, 0.4);
        }

        .error-toast.show {
            display: flex;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式调整 */
        @media (min-width: 768px) {
            .search-card {
                max-width: 600px;
                margin: 0 auto;
            }

            #resultPage {
                flex-direction: row;
            }

            .map-container {
                width: 50%;
                height: 100vh;
                position: fixed;
                top: 0;
                left: 0;
            }

            #resultMap {
                width: 100%;
                height: 100%;
            }

            .results-container {
            width: 50%;
            margin-left: 50%;
            display: flex;
            flex-direction: column;
            max-height: 100vh;
            overflow: hidden;
        }

            .result-header {
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .modal-content {
                max-width: 500px;
                border-radius: 20px;
                margin-bottom: 30px;
            }

            .back-btn {
                top: 20px;
                left: 20px;
                right: auto;
            }
        }

        @media (max-width: 767px) {
            .map-container {
                width: 100%;
                height: 40vh;
                min-height: 250px;
                flex-shrink: 0;
            }

            #resultMap {
                width: 100%;
                height: 100%;
            }

            .results-container {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                min-height: 0;
            }

            .back-btn {
                top: 15px;
                right: 15px;
                left: auto;
            }

            /* 移动端卡片式布局 */
            .routes-table-wrapper {
                padding: 8px;
            }

            .routes-table {
                display: none;
            }

            .mobile-route-list {
                display: block;
            }

            .mobile-route-card {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border-radius: 16px;
                padding: 16px;
                margin-bottom: 10px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
                border: 1px solid rgba(0, 0, 0, 0.04);
            }

            .mobile-route-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 12px;
            }

            .mobile-route-airports {
                display: flex;
                align-items: center;
                gap: 8px;
                flex: 1;
            }

            .mobile-airport {
                text-align: center;
                flex: 1;
            }

            .mobile-airport-code {
                font-size: 18px;
                font-weight: 700;
                color: #333;
                display: block;
            }

            .mobile-airport-name {
                font-size: 11px;
                color: #666;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: block;
                max-width: 100px;
            }

            .mobile-route-arrow {
                color: #999;
                font-size: 16px;
            }

            .mobile-route-info {
                display: flex;
                align-items: center;
                gap: 16px;
                margin-bottom: 8px;
            }

            .mobile-info-item {
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .mobile-info-icon {
                font-size: 14px;
                color: #6366f1;
            }

            .mobile-info-value {
                font-size: 13px;
                font-weight: 600;
                color: #333;
            }

            .mobile-info-label {
                font-size: 11px;
                color: #999;
            }

            .mobile-route-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .mobile-score {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .mobile-score-value {
                font-size: 16px;
                font-weight: 700;
                color: #e65100;
            }

            .mobile-price {
                font-size: 18px;
                font-weight: 700;
                color: #f44336;
            }

            .mobile-location {
                font-size: 10px;
                color: #888;
                margin-top: 4px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }

        @media (max-width: 480px) {
            .input-row {
                flex-direction: column;
            }

            .input-group input[type="number"] {
                width: 100%;
            }

            .tab {
                min-width: 80px;
                font-size: 12px;
                padding: 10px 4px;
            }

            .search-card {
                padding: 16px;
            }

            .result-header {
                padding: 12px 15px;
            }

            .airport-tag {
                padding: 8px 10px;
                font-size: 12px;
            }
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            z-index: 1000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #f5f5f5;
            transform: scale(1.05);
        }

        .back-btn i {
            margin-right: 2px;
        }

        /* 自动完成下拉框 */
        .autocomplete-container {
            position: relative;
        }

        .autocomplete-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1001;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .autocomplete-dropdown.show {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background: #f0f0f8;
        }

        .autocomplete-item.active {
            background: #667eea;
            color: white;
        }

        .autocomplete-item .airport-code {
            font-weight: bold;
            font-size: 16px;
            margin-right: 10px;

<body>
    <!-- 搜索页面 -->
    <div id="searchPage" class="page active">
        <div class="map-wrapper">
            <div id="searchMap"></div>
            <div id="searchMapLoader" class="map-loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">地图加载中...</div>
            </div>
        </div>
        <div class="search-overlay">
            <div class="search-card">
                <!-- 起点 -->
                <div class="input-row origin">
                    <div class="input-group autocomplete-container">
                        <label><i class="fas fa-plane-departure"></i> 起点机场IATA码</label>
                        <input type="text" id="originIata" placeholder="输入城市或国家搜索，如：北京、Shanghai" autocomplete="off">
                        <div class="autocomplete-dropdown" id="originDropdown"></div>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-ruler"></i> 搜索半径（公里）</label>
                        <input type="number" id="originRadius" value="100" min="50" max="1000" step="50">
                    </div>
                </div>

                <!-- 终点 -->
                <div class="input-row destination">
                    <div class="input-group autocomplete-container">
                        <label><i class="fas fa-plane-arrival"></i> 终点机场IATA码</label>
                        <input type="text" id="destIata" placeholder="输入城市或国家搜索，如：东京、Tokyo" autocomplete="off">
                        <div class="autocomplete-dropdown" id="destDropdown"></div>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-ruler"></i> 搜索半径（公里）</label>
                        <input type="number" id="destRadius" value="100" min="50" max="1000" step="50">
                    </div>
                </div>

                <button class="search-btn" onclick="searchRoutes()">
                    <i class="fas fa-search"></i> 查询
                </button>
            </div>
        </div>
    </div>

    <!-- 结果页面 -->
    <div id="resultPage" class="page">
        <div class="map-container">
            <div class="map-wrapper">
                <div id="resultMap"></div>
                <div id="resultMapLoader" class="map-loader">
                    <div class="loader-spinner"></div>
                    <div class="loader-text">地图加载中...</div>
                </div>
            </div>
        </div>
        <div class="results-container">
            <div class="result-header">
                <div class="result-info" id="resultInfo">
                    <span class="airport-tag origin">
                        <i class="fas fa-plane-departure"></i>
                        <span id="originInfo">选择起点</span>
                    </span>
                    <span class="route-arrow"><i class="fas fa-arrow-right"></i></span>
                    <span class="airport-tag destination">
                        <i class="fas fa-plane-arrival"></i>
                        <span id="destInfo">选择终点</span>
                    </span>
                </div>
            </div>

            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('routes')" id="tabRoutes">航线组合</button>
                    <button class="tab" onclick="switchTab('origin')" id="tabOrigin">起点周边机场</button>
                    <button class="tab" onclick="switchTab('dest')" id="tabDest">终点周边机场</button>
                </div>
            </div>

            <div class="tab-content active" id="contentRoutes">
                <div class="routes-table-wrapper">
                    <table class="routes-table">
                        <thead>
                            <tr>
                                <th>出发机场</th>
                                <th>到达机场</th>
                                <th>飞行距离</th>
                                <th>低价推荐指数</th>
                                <th>预估价格</th>
                            </tr>
                        </thead>
                        <tbody id="routesBody">
                            <tr><td colspan="5" style="text-align:center; padding: 30px; color:#999;">点击查询开始搜索</td></tr>
                        </tbody>
                    </table>
                </div>
                <button class="view-all-btn" onclick="viewAllRoutes()" style="display:none;" id="viewAllBtn">查看全部</button>
            </div>

            <div class="tab-content" id="contentOrigin">
                <div class="airport-list-wrapper" id="originAirportList">
                    <p style="text-align:center; color:#999; padding: 30px;">点击查询开始搜索</p>
                </div>
            </div>

            <div class="tab-content" id="contentDest">
                <div class="airport-list-wrapper" id="destAirportList">
                    <p style="text-align:center; color:#999; padding: 30px;">点击查询开始搜索</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 评分详情弹窗 -->
    <div class="modal-overlay" id="detailModal" onclick="closeDetailModal()">
        <div class="modal-content" onclick="event.stopPropagation()">

            </div>
            <div id="detailContent"></div>
        </div>
    </div>

            Object.keys(CHINESE_TO_ENGLISH).forEach(key => {
                if (key.includes(chineseQuery) || chineseQuery.includes(key)) {
                    keywords.push(...CHINESE_TO_ENGLISH[key]);
                }
            });
            return [...new Set(keywords)]; // 去重
        }

        // 搜索建议功能
        function searchAirports(query, type) {
            const dropdown = document.getElementById(type + 'Dropdown');
            if (!query || query.length < 1) {
                dropdown.classList.remove('show');
                return;
            }

            const queryUpper = query.toUpperCase();
            const queryLower = query.toLowerCase();

            // 获取中文对应的英文关键词
            const englishKeywords = getEnglishKeywords(query);

            // 判断是否是中文输入
            const isChinese = /[\u4e00-\u9fa5]/.test(query);
            
            // 中文转拼音（用于搜索）
            const pinyinQuery = isChinese ? chineseToPinyin(query) : '';
            
            // 搜索匹配：IATA码、城市、国家，支持中英文和拼音
            const matches = airportsData.filter(airport => {
                if (isChinese) {
                    // 中文输入：尝试多种匹配方式
                    let matched = false;
                    
                    // 1. 先尝试中文映射表的关键词匹配
                    if (englishKeywords.length > 0) {
                        matched = englishKeywords.some(keyword => {
                            const kwUpper = keyword.toUpperCase();
                            const kwLower = keyword.toLowerCase();
                            
                            if (keyword.length === 2) {
                                // 国家代码
                                return airport.iso_country === kwUpper;
                            } else if (keyword.length === 3) {
                                // IATA码
                                return airport.iata_code.toUpperCase() === kwUpper;
                            } else {
                                // 城市名或国家名
                                if (airport.municipality && airport.municipality.toLowerCase().includes(kwLower)) {
                                    return true;
                                }
                                if (airport.name && airport.name.toLowerCase().includes(kwLower)) {
                                    return true;
                                }
                                if (airport.iso_country && airport.iso_country.toLowerCase().includes(kwLower)) {
                                    return true;
                                }
                                return false;
                            }
                        });
                    }
                    
                    // 2. 如果映射表没匹配到，尝试拼音匹配
                    if (!matched && pinyinQuery) {
                        const pinyinLower = pinyinQuery.toLowerCase();
                        // 用拼音匹配城市名
                        if (airport.municipality && airport.municipality.toLowerCase().includes(pinyinLower)) {
                            matched = true;
                        }
                        // 用拼音匹配机场名称
                        if (!matched && airport.name && airport.name.toLowerCase().includes(pinyinLower)) {
                            matched = true;
                        }
                    }
                    
                    return matched;
                } else {
                    // 英文输入：使用原有的匹配逻辑
                    return airport.iata_code.toUpperCase().includes(queryUpper) ||
                           (airport.name && airport.name.toLowerCase().includes(queryLower)) ||
                           (airport.municipality && airport.municipality.toLowerCase().includes(queryLower)) ||
                           (airport.iso_country && airport.iso_country.toLowerCase().includes(queryLower));
                }
            }).slice(0, 10);

            if (matches.length === 0) {
                dropdown.innerHTML = '<div class="no-results">未找到匹配的机场</div>';
            } else {
                dropdown.innerHTML = '<div class="search-hint">↑↓ 选择机场，回车确认</div>' +
                    matches.map((airport, index) => {
                        // 获取城市和国家的中文名称
                        const cityChinese = getChineseName(airport.municipality);
                        const countryChinese = getChineseName(airport.iso_country);
                        
                        // 构建显示文本
                        let cityText = airport.municipality || '未知城市';
                        if (cityChinese) {
                            cityText += ' <span class="chinese-name">(' + cityChinese + ')</span>';
                        }
                        
                        let countryText = airport.iso_country || '未知国家';
                        if (countryChinese) {
                            countryText += ' <span class="chinese-name">(' + countryChinese + ')</span>';
                        }
                        
                        return `
                    <div class="autocomplete-item" data-iata="${airport.iata_code}" data-type="${type}">
                        <div>
                            <span class="airport-code">${airport.iata_code || '-'}</span>
                            <span class="airport-name">${airport.name || '未知机场'}</span>
                        </div>
                        <div class="airport-city">${cityText}, ${countryText}</div>
                    </div>
                `;
                    }).join('');
            }

            dropdown.classList.add('show');
            originSelectedIndex = -1;
            destSelectedIndex = -1;

            // 添加点击事件
            dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
                item.addEventListener('click', function() {
                    const iata = this.getAttribute('data-iata');
                    const type = this.getAttribute('data-type');
                    selectAirport(iata, type);
                });
            });
        }

        function hideDropdown(type) {

        function handleAutocompleteKeydown(event, type) {
            const dropdown = document.getElementById(type + 'Dropdown');
            if (!dropdown.classList.contains('show')) return;

            const items = dropdown.querySelectorAll('.autocomplete-item');
            if (items.length === 0) return;

            const selectedIndex = type === 'origin' ? originSelectedIndex : destSelectedIndex;

            if (event.key === 'ArrowDown') {
                event.preventDefault();
                const newIndex = selectedIndex < items.length - 1 ? selectedIndex + 1 : 0;
                if (selectedIndex >= 0) items[selectedIndex].classList.remove('active');
                items[newIndex].classList.add('active');
                if (type === 'origin') originSelectedIndex = newIndex;
                else destSelectedIndex = newIndex;
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                const newIndex = selectedIndex > 0 ? selectedIndex - 1 : items.length - 1;
                if (selectedIndex >= 0) items[selectedIndex].classList.remove('active');
                items[newIndex].classList.add('active');
                if (type === 'origin') originSelectedIndex = newIndex;
                else destSelectedIndex = newIndex;
            } else if (event.key === 'Enter' && selectedIndex >= 0) {
                event.preventDefault();
                const iata = items[selectedIndex].getAttribute('data-iata');
                selectAirport(iata, type);
            } else if (event.key === 'Escape') {
                hideDropdown(type);
            }
        }

        // 机场属性数据库
        const AIRPORT_PROPERTIES = {
            'PVG': { is_lcc_base: true, hub_size: 5 },
            'SHA': { is_lcc_base: true, hub_size: 5 },
            'CAN': { is_lcc_base: true, hub_size: 5 },
            'SZX': { is_lcc_base: true, hub_size: 5 },
            'CTU': { is_lcc_base: true, hub_size: 5 },
            'PEK': { is_lcc_base: false, hub_size: 5 },
            'PKX': { is_lcc_base: true, hub_size: 5 },
            'LAX': { is_lcc_base: true, hub_size: 5 },
            'JFK': { is_lcc_base: false, hub_size: 5 },
            'LHR': { is_lcc_base: false, hub_size: 5 },
            'CDG': { is_lcc_base: false, hub_size: 5 },
            'NRT': { is_lcc_base: false, hub_size: 5 },
            'ICN': { is_lcc_base: true, hub_size: 5 },
            'SIN': { is_lcc_base: false, hub_size: 5 },
            'default': { is_lcc_base: false, hub_size: 2 }
        };

        function getAirportProperties(iata) {
            return AIRPORT_PROPERTIES[iata.toUpperCase()] || AIRPORT_PROPERTIES['default'];
        }

        // 计算预估价格（单位：元）
        function calculateEstimatedPrice(originIata, destIata, distance) {
            const originProps = getAirportProperties(originIata);
            const destProps = getAirportProperties(destIata);
            
            // 基础票价（最低票价）
            let price = 100;
            
            // 距离因素（每公里约0.3元）
            price += distance * 0.3;
            
            // LCC折扣（低成本航司基地打8折）
            let discount = 1;
            if (originProps.is_lcc_base || destProps.is_lcc_base) {
                discount *= 0.8;
            }
            
            // 竞争折扣（机场吞吐量越高，折扣越大）
            const avgHubSize = (originProps.hub_size + destProps.hub_size) / 2;
            discount *= (1 - avgHubSize * 0.02); // 每级减少2%
            
            // 应用折扣
            price *= discount;
            
            // 随机波动（±10%）
            const randomFactor = 0.9 + Math.random() * 0.2;
            price *= randomFactor;
            
            // 确保最低价格不低于50元
            price = Math.max(price, 50);
            
            return Math.round(price);
        }

        function calculateLowCostScore(originIata, destIata) {
            let totalScore = 0;
            const breakdown = {
                originLcc: 0,
                destLcc: 0,
                competition: 0,
                distance: 0,
                random: 0
            };

            const originProps = getAirportProperties(originIata);
            const destProps = getAirportProperties(destIata);

            if (originProps.is_lcc_base) breakdown.originLcc = 15;
            if (destProps.is_lcc_base) breakdown.destLcc = 15;
            breakdown.lccTotal = breakdown.originLcc + breakdown.destLcc;
            totalScore += Math.min(breakdown.lccTotal, 30);

            const avgHubSize = (originProps.hub_size + destProps.hub_size) / 2;
            breakdown.competition = Math.round((avgHubSize / 5) * 30);
            totalScore += breakdown.competition;

            const originAirport = airportsData.find(a => a.iata_code === originIata.toUpperCase());
            const destAirport = airportsData.find(a => a.iata_code === destIata.toUpperCase());

            if (originAirport && destAirport) {
                const distance = haversineDistance(
                    originAirport.latitude_deg,
                    originAirport.longitude_deg,
                    destAirport.latitude_deg,
                    destAirport.longitude_deg
                );
                breakdown.distanceKm = Math.round(distance);

                if (distance >= 800 && distance <= 1500) {
                    breakdown.distance = 20;
                    breakdown.distanceTip = '800-1500km最佳区间';
                } else {
                    breakdown.distance = 10;
                    breakdown.distanceTip = '其他距离区间';
                }
            } else {
                breakdown.distanceKm = 0;
                breakdown.distance = 10;
                breakdown.distanceTip = '数据缺失';
            }
            totalScore += breakdown.distance;

            const seed = originIata.toUpperCase().charCodeAt(0) + destIata.toUpperCase().charCodeAt(0);
            const randomFactor = ((seed * 9301 + 49297) % 233280) / 233280;
            breakdown.random = Math.round(randomFactor * 20);
            totalScore += breakdown.random;

            breakdown.total = Math.min(100, Math.max(0, totalScore));
            breakdown.originHubSize = originProps.hub_size;
            breakdown.destHubSize = destProps.hub_size;
            breakdown.originIsLcc = originProps.is_lcc_base;
            breakdown.destIsLcc = destProps.is_lcc_base;

            return breakdown;
        }

        function scoreToStars(score) {
            if (score >= 80) return 5;
            if (score >= 65) return 4;
            if (score >= 50) return 3;
            if (score >= 35) return 2;
            return 1;
        }

        function generateStarsHTML(stars) {
            let html = '<div class="star-rating">';
            for (let i = 1; i <= 5; i++) {
                html += `<span class="star ${i <= stars ? 'filled' : ''}">★</span>`;
            }
            html += '</div>';
            return html;
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function toRad(deg) {
            return deg * (Math.PI / 180);
        }

        async function loadAirportsData() {
            try {
                const response = await fetch('airports_full.csv');
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim());
                const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
                
                airportsData = lines.slice(1).map(line => {
                    const values = parseCSVLine(line);
                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = values[index] ? values[index].replace(/"/g, '') : '';
                    });
                    obj.latitude_deg = parseFloat(obj.latitude_deg) || 0;
                    obj.longitude_deg = parseFloat(obj.longitude_deg) || 0;
                    return obj;
                });

                airportsData = airportsData.filter(a => a.iata_code && a.iata_code.length === 3);
                console.log(`已加载 ${airportsData.length} 个机场数据`);
                initMaps();
            } catch (error) {
                showError('加载数据失败，请确保 airports_full.csv 文件存在');
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        async function searchRoutes() {
            console.log('searchRoutes called');
            const originIata = document.getElementById('originIata').value.toUpperCase().trim();
            const originRadius = parseInt(document.getElementById('originRadius').value) || 300;
            const destIata = document.getElementById('destIata').value.toUpperCase().trim();
            const destRadius = parseInt(document.getElementById('destRadius').value) || 300;

            console.log('originIata:', originIata, 'originRadius:', originRadius, 'destIata:', destIata, 'destRadius:', destRadius);
            console.log('airportsData length:', airportsData.length);

            if (!originIata || originIata.length !== 3) {
                showError('请输入有效的起点机场IATA码（例如：PEK）');
                return;
            }

            const originAirport = airportsData.find(a => a.iata_code === originIata);
            if (!originAirport) {
                showError(`未找到起点机场: ${originIata}`);
                return;
            }

            let destAirport = null;
            if (destIata) {
                if (destIata.length !== 3) {
                    showError('请输入有效的终点机场IATA码（例如：SHA）');
                    return;
                }
                destAirport = airportsData.find(a => a.iata_code === destIata);
                if (!destAirport) {
                    showError(`未找到终点机场: ${destIata}`);
                    return;
                }
            }

            // 计算周边机场
            const originNearby = airportsData
                .filter(a => a.iata_code !== originAirport.iata_code)
                .map(a => ({
                    ...a,
                    distance: haversineDistance(
                        originAirport.latitude_deg,
                        originAirport.longitude_deg,
                        a.latitude_deg,
                        a.longitude_deg
                    )
                }))
                .filter(a => a.distance <= originRadius)
                .sort((a, b) => a.distance - b.distance);

            // 如果没有终点机场，执行单点搜索
            if (!destAirport) {
                // 单点搜索：只显示周边机场
                allRoutes = [];
                displayedRoutesCount = 0;
                airportExpanded = false;
                displayedAirportCount = 5;

                // 更新UI
                updateResultPage(originAirport, null, originNearby, []);
                switchToResultPage();
                updateResultMap(originAirport, originNearby, originRadius, null, [], 0);
                return;
            }

            const destNearby = airportsData
                .filter(a => a.iata_code !== destAirport.iata_code)
                .map(a => ({
                    ...a,
                    distance: haversineDistance(
                        destAirport.latitude_deg,
                        destAirport.longitude_deg,
                        a.latitude_deg,
                        a.longitude_deg
                    )
                }))
                .filter(a => a.distance <= destRadius)
                .sort((a, b) => a.distance - b.distance);

            // 生成航线组合
            const allOrigins = [{...originAirport, distance: 0}].concat(originNearby);
            const allDests = [{...destAirport, distance: 0}].concat(destNearby);

            allRoutes = [];
            allOrigins.forEach(origin => {
                allDests.forEach(dest => {
                    if (origin.iata_code !== dest.iata_code) {
                        const distance = haversineDistance(
                            origin.latitude_deg,
                            origin.longitude_deg,
                            dest.latitude_deg,
                            dest.longitude_deg
                        );
                        const scoreBreakdown = calculateLowCostScore(origin.iata_code, dest.iata_code);
                        const estimatedPrice = calculateEstimatedPrice(origin.iata_code, dest.iata_code, distance);

                        allRoutes.push({
                            origin: origin,
                            dest: dest,
                            distance: distance,
                            scoreBreakdown: scoreBreakdown,
                            estimatedPrice: estimatedPrice
                        });
                    }
                });
            });

            allRoutes.sort((a, b) => b.scoreBreakdown.total - a.scoreBreakdown.total);
            displayedRoutesCount = 5;
            routesExpanded = false;
            airportExpanded = false;
            displayedAirportCount = 5;

            // 更新UI
            updateResultPage(originAirport, destAirport, originNearby, destNearby);
            switchToResultPage();
            updateResultMap(originAirport, originNearby, originRadius, destAirport, destNearby, destRadius);
        }

                        <span class="price-hint">预估</span>
                    </td>
                </tr>
                `;
            }).join('');

            // 生成移动端卡片布局
            mobileContainer.innerHTML = routesToShow.map((route, index) => {
                const breakdown = route.scoreBreakdown;
                const score = breakdown.total;
                const stars = scoreToStars(score);
                const starsHTML = generateStarsHTML(stars);

                // 获取城市和国家的中文名称
                const originCityCn = getChineseName(route.origin.municipality) || '';
                const destCityCn = getChineseName(route.dest.municipality) || '';
                const originCountryCn = getChineseName(route.origin.iso_country) || '';
                const destCountryCn = getChineseName(route.dest.iso_country) || '';

                return `
                <div class="mobile-route-card" onclick="showDetailModal(${index})">
                    <div class="mobile-route-header">
                        <div class="mobile-route-airports">
                            <div class="mobile-airport">
                                <span class="mobile-airport-code">${route.origin.iata_code}</span>
                                <span class="mobile-airport-name">${route.origin.name}</span>
                                <span class="mobile-location">${route.origin.municipality || '未知'}${originCityCn ? ' (' + originCityCn + ')' : ''}, ${route.origin.iso_country || '未知'}${originCountryCn ? ' (' + originCountryCn + ')' : ''}</span>
                            </div>
                            <span class="mobile-route-arrow"><i class="fas fa-arrow-right"></i></span>
                            <div class="mobile-airport">
                                <span class="mobile-airport-code">${route.dest.iata_code}</span>
                                <span class="mobile-airport-name">${route.dest.name}</span>
                                <span class="mobile-location">${route.dest.municipality || '未知'}${destCityCn ? ' (' + destCityCn + ')' : ''}, ${route.dest.iso_country || '未知'}${destCountryCn ? ' (' + destCountryCn + ')' : ''}</span>
                            </div>
                        </div>
                    </div>
                    <div class="mobile-route-info">
                        <div class="mobile-info-item">
                            <i class="fas fa-route mobile-info-icon"></i>
                            <span class="mobile-info-value">${route.distance.toFixed(1)} km</span>
                        </div>
                    </div>
                    <div class="mobile-route-footer">
                        <div class="mobile-score">
                            <span class="mobile-score-value">${score}分</span>
                            <span>${starsHTML}</span>
                        </div>
                        <span class="mobile-price">¥${route.estimatedPrice}</span>
                    </div>
                </div>
                `;
            }).join('');

            document.getElementById('viewAllBtn').textContent = routesExpanded ? '收起部分' : `查看全部 (${allRoutes.length})`;
            document.getElementById('viewAllBtn').style.display = allRoutes.length > 5 ? 'block' : 'none';
            document.getElementById('viewAllBtn').onclick = viewAllRoutes;
        }

        function displayOriginAirports(mainAirport, nearby) {
            const container = document.getElementById('originAirportList');
            const toShow = nearby.slice(0, displayedAirportCount);
            
            let html = `<div class="airport-item origin" style="background:#e3f2fd;">
                <div class="airport-info">
                    <h4>${mainAirport.name}</h4>
                    <p>${mainAirport.iata_code} · ${mainAirport.municipality || '未知'} · ${mainAirport.iso_country || '未知'}</p>
                </div>
                <div class="airport-distance">
                    <div class="distance-value" style="color:#1565c0;">起点</div>
                </div>
            </div>`;

            html += toShow.map(airport => `
                <div class="airport-item origin">
                    <div class="airport-info">
                        <h4>${airport.name}</h4>
                        <p>${airport.iata_code} · ${airport.municipality || '未知'}</p>
                    </div>
                    <div class="airport-distance">
                        <div class="distance-value">${airport.distance.toFixed(1)}</div>
                        <div class="distance-unit">公里</div>
                    </div>
                </div>
            `).join('');

            if (nearby.length > 5) {
                html += `<button class="view-all-btn" onclick="toggleOriginAirports(${nearby.length})" id="originToggleBtn">
                    ${airportExpanded ? '收起部分' : `查看全部 (${nearby.length})`}
                </button>`;
            }

            container.innerHTML = html;
        }

        function toggleOriginAirports(total) {
            if (airportExpanded) {
                displayedAirportCount = 5;
                airportExpanded = false;
            } else {
                displayedAirportCount = total;
                airportExpanded = true;
            }
            const originAirport = airportsData.find(a => a.iata_code === document.getElementById('originIata').value.toUpperCase());
            displayOriginAirports(originAirport, originNearbyAll);
        }

        function displayDestAirports(mainAirport, nearby) {
            const container = document.getElementById('destAirportList');
            const toShow = nearby.slice(0, displayedAirportCount);
            
            let html = `<div class="airport-item destination" style="background:#e8f5e9;">
                <div class="airport-info">
                    <h4>${mainAirport.name}</h4>
                    <p>${mainAirport.iata_code} · ${mainAirport.municipality || '未知'} · ${mainAirport.iso_country || '未知'}</p>
                </div>
                <div class="airport-distance">
                    <div class="distance-value" style="color:#2e7d32;">终点</div>
                </div>
            </div>`;

            html += toShow.map(airport => `
                <div class="airport-item destination">
                    <div class="airport-info">
                        <h4>${airport.name}</h4>
                        <p>${airport.iata_code} · ${airport.municipality || '未知'}</p>
                    </div>
                    <div class="airport-distance">
                        <div class="distance-value">${airport.distance.toFixed(1)}</div>
                        <div class="distance-unit">公里</div>
                    </div>
                </div>
            `).join('');

            if (nearby.length > 5) {
                html += `<button class="view-all-btn" onclick="toggleDestAirports(${nearby.length})" id="destToggleBtn">
                    ${airportExpanded ? '收起部分' : `查看全部 (${nearby.length})`}
                </button>`;
            }

            container.innerHTML = html;
        }

        function toggleDestAirports(total) {
            if (airportExpanded) {
                displayedAirportCount = 5;
                airportExpanded = false;
            } else {
                displayedAirportCount = total;
                airportExpanded = true;
            }
            const destAirport = airportsData.find(a => a.iata_code === document.getElementById('destIata').value.toUpperCase());
            displayDestAirports(destAirport, destNearbyAll);
        }

        function updateResultMap(origin, originNearby, originRadius, dest, destNearby, destRadius) {
            resultMap.eachLayer(layer => {
                if (layer !== resultMap._layers[Object.keys(resultMap._layers)[0]]) {
                    resultMap.removeLayer(layer);
                }
            });

            const centerLat = (origin.latitude_deg + dest.latitude_deg) / 2;
            const centerLon = (origin.longitude_deg + dest.longitude_deg) / 2;
            const maxLat = Math.max(origin.latitude_deg, dest.latitude_deg, ...originNearby.map(a => a.latitude_deg), ...destNearby.map(a => a.latitude_deg));
            const minLat = Math.min(origin.latitude_deg, dest.latitude_deg, ...originNearby.map(a => a.latitude_deg), ...destNearby.map(a => a.latitude_deg));
            const maxLon = Math.max(origin.longitude_deg, dest.longitude_deg, ...originNearby.map(a => a.longitude_deg), ...destNearby.map(a => a.longitude_deg));
            const minLon = Math.min(origin.longitude_deg, dest.longitude_deg, ...originNearby.map(a => a.longitude_deg), ...destNearby.map(a => a.longitude_deg));

            const latDiff = maxLat - minLat;
            const lonDiff = maxLon - minLon;
            const maxDiff = Math.max(latDiff, lonDiff);
            
            let zoom = 3;
            if (maxDiff < 1) zoom = 10;
            else if (maxDiff < 2) zoom = 9;
            else if (maxDiff < 5) zoom = 7;
            else if (maxDiff < 10) zoom = 5;
            else if (maxDiff < 20) zoom = 4;

            resultMap.setView([centerLat, centerLon], zoom);

            // 起点标记
            L.marker([origin.latitude_deg, origin.longitude_deg], {
                icon: L.divIcon({
                    className: 'origin-marker',
                    html: '<div style="background:#1e88e5; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(30,136,238,0.5); outline:none; border:none;"><i class="fas fa-plane-departure" style="color:white; font-size:18px;"></i></div>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                })
            }).addTo(resultMap).bindPopup(`<strong>${origin.name}</strong><br>IATA: ${origin.iata_code}<br><span style="color:#1565c0;">起点机场</span>`);

            // 终点标记
            L.marker([dest.latitude_deg, dest.longitude_deg], {
                icon: L.divIcon({
                    className: 'dest-marker',
                    html: '<div style="background:#4caf50; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(76,175,80,0.5); outline:none; border:none;"><i class="fas fa-plane-arrival" style="color:white; font-size:18px;"></i></div>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                })
            }).addTo(resultMap).bindPopup(`<strong>${dest.name}</strong><br>IATA: ${dest.iata_code}<br><span style="color:#2e7d32;">终点机场</span>`);

            // 起点半径圈
            L.circle([origin.latitude_deg, origin.longitude_deg], {
                radius: originRadius * 1000,
                color: '#42a5f5',
                fillColor: '#42a5f5',
                fillOpacity: 0.1,
                dashArray: '5,5'
            }).addTo(resultMap).bindPopup(`起点搜索半径: ${originRadius}公里`);

            // 终点半径圈
            L.circle([dest.latitude_deg, dest.longitude_deg], {
                radius: destRadius * 1000,
                color: '#66bb6a',
                fillColor: '#66bb6a',
                fillOpacity: 0.1,
                dashArray: '5,5'
            }).addTo(resultMap).bindPopup(`终点搜索半径: ${destRadius}公里`);

            // 清空之前的航线连线
            routePolylines.forEach(polyline => {
                resultMap.removeLayer(polyline);
            });
            routePolylines = [];

            // 起点周边机场
            originNearby.forEach(airport => {
                L.marker([airport.latitude_deg, airport.longitude_deg], {
                    icon: L.divIcon({
                        html: '<div style="background:#90caf9; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; outline:none; border:none;"><i class="fas fa-circle" style="color:#1565c0; font-size:10px;"></i></div>',
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    })
                }).addTo(resultMap).bindPopup(`<strong>${airport.name}</strong><br>IATA: ${airport.iata_code}<br>距离: ${airport.distance.toFixed(1)}公里`);
            });

            // 终点周边机场
            destNearby.forEach(airport => {
                L.marker([airport.latitude_deg, airport.longitude_deg], {
                    icon: L.divIcon({
                        html: '<div style="background:#a5d6a7; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; outline:none; border:none;"><i class="fas fa-circle" style="color:#2e7d32; font-size:10px;"></i></div>',
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    })
                }).addTo(resultMap).bindPopup(`<strong>${airport.name}</strong><br>IATA: ${airport.iata_code}<br>距离: ${airport.distance.toFixed(1)}公里`);
            });

            // 为每条航线添加连线
            allRoutes.forEach((route, index) => {
                const polyline = L.polyline(
                    [[route.origin.latitude_deg, route.origin.longitude_deg], [route.dest.latitude_deg, route.dest.longitude_deg]], 
                    {
                        color: index === 0 ? '#f44336' : '#ddd',
                        weight: index === 0 ? 5 : 2,
                        opacity: index === 0 ? 0.8 : 0.3,
                        dashArray: index === 0 ? '10,10' : '5,5'
                    }
                ).addTo(resultMap);
                
                polyline.routeIndex = index;
                routePolylines.push(polyline);
            });
        }

        function switchToResultPage() {
            document.getElementById('searchPage').classList.remove('active');
            document.getElementById('resultPage').classList.add('active');
            document.getElementById('backBtn').style.display = 'block';
            // 地图尺寸可能发生变化，需要重新计算
            setTimeout(() => {
                if (resultMap) {
                    resultMap.invalidateSize();
                }
            }, 100);
        }

        function goBack() {
            document.getElementById('resultPage').classList.remove('active');
            document.getElementById('searchPage').classList.add('active');
            document.getElementById('backBtn').style.display = 'none';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.getElementById(`tab${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`).classList.add('active');
            document.getElementById(`content${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`).classList.add('active');
        }

        let currentDetailIndex = -1;

        function showDetailModal(index) {
            currentDetailIndex = index;
            
            // 重置页签状态
            document.getElementById('tabScore').classList.add('active');
            document.getElementById('tabPrice').classList.remove('active');
            
            // 默认显示评分详情
            showDetailContent('score');
            
            document.getElementById('detailModal').classList.add('show');
            
            // 高亮地图上对应的航线
            highlightRouteOnMap(index);
        }

        function highlightRouteOnMap(index) {
            if (!resultMap || routePolylines.length === 0) return;
            
            routePolylines.forEach((polyline, i) => {
                if (i === index) {
                    // 高亮选中的航线
                    polyline.setStyle({
                        color: '#f44336',
                        weight: 5,
                        opacity: 0.8,
                        dashArray: '10,10'
                    });
                } else {
                    // 其他航线变灰
                    polyline.setStyle({
                        color: '#ddd',
                        weight: 2,
                        opacity: 0.3,
                        dashArray: '5,5'
                    });
                }
            });
            
            // 聚焦到选中的航线
            const route = allRoutes[index];
            if (route) {
                const bounds = L.latLngBounds([
                    [route.origin.latitude_deg, route.origin.longitude_deg],
                    [route.dest.latitude_deg, route.dest.longitude_deg]
                ]);
                resultMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
            }
        }

        function showDetailContent(tabType) {
            if (currentDetailIndex < 0) return;
            
            const route = allRoutes[currentDetailIndex];
            const breakdown = route.scoreBreakdown;
            const score = breakdown.total;
            const stars = scoreToStars(score);
            const starsHTML = generateStarsHTML(stars);

            // 获取城市和国家的中文名称
            const originCityCn = getChineseName(route.origin.municipality) || '';
            const destCityCn = getChineseName(route.dest.municipality) || '';
            const originCountryCn = getChineseName(route.origin.iso_country) || '';
            const destCountryCn = getChineseName(route.dest.iso_country) || '';

            // 获取机场属性用于价格计算
            const originProps = getAirportProperties(route.origin.iata_code);
            const destProps = getAirportProperties(route.dest.iata_code);
            const avgHubSize = (originProps.hub_size + destProps.hub_size) / 2;
            const isLccRoute = originProps.is_lcc_base || destProps.is_lcc_base;
            const lccDiscount = isLccRoute ? 0.8 : 1;
            const competitionDiscount = (1 - avgHubSize * 0.02);
            const distanceBasePrice = route.distance * 0.3;

            // 更新页签状态
            document.getElementById('tabScore').classList.toggle('active', tabType === 'score');
            document.getElementById('tabPrice').classList.toggle('active', tabType === 'price');

            if (tabType === 'score') {
                document.getElementById('detailContent').innerHTML = `
                    <div style="margin-bottom:15px; padding:15px; background:#f8f9fa; border-radius:10px;">
                        <div style="font-weight:600; color:#333; margin-bottom:5px;">${route.origin.iata_code} → ${route.dest.iata_code}</div>
                        <div style="font-size:14px; color:#666; margin-bottom:8px;">${route.origin.name} 到 ${route.dest.name}</div>
                        <div style="font-size:13px; color:#888;">
                            <div>出发地: ${route.origin.municipality || '未知'}${originCityCn ? ' (' + originCityCn + ')' : ''}, ${route.origin.iso_country || '未知'}${originCountryCn ? ' (' + originCountryCn + ')' : ''}</div>
                            <div>目的地: ${route.dest.municipality || '未知'}${destCityCn ? ' (' + destCityCn + ')' : ''}, ${route.dest.iso_country || '未知'}${destCountryCn ? ' (' + destCountryCn + ')' : ''}</div>
                        </div>
                    </div>
                    <div class="score-detail-grid">
                        <div class="score-detail-item">
                            <div class="label">出发地低成本航司基地</div>
                            <div class="value">+${breakdown.originLcc}分</div>
                            <div class="desc">
                                <span class="lcc-badge ${breakdown.originIsLcc ? 'yes' : 'no'}">${breakdown.originIsLcc ? '是' : '否'}</span>
                                ${route.origin.iata_code}
                            </div>
                        </div>
                        <div class="score-detail-item">
                            <div class="label">目的地低成本航司基地</div>
                            <div class="value">+${breakdown.destLcc}分</div>
                            <div class="desc">
                            <span class="lcc-badge ${breakdown.destIsLcc ? 'yes' : 'no'}">${breakdown.destIsLcc ? '是' : '否'}</span>
                            ${route.dest.iata_code}
                        </div>
                    </div>
                        <div class="score-detail-item">
                            <div class="label">航线竞争度</div>
                            <div class="value">+${breakdown.competition}分</div>
                            <div class="desc">吞吐量: ${breakdown.originHubSize}级 | ${breakdown.destHubSize}级</div>
                        </div>
                        <div class="score-detail-item">
                            <div class="label">飞行距离</div>
                            <div class="value">+${breakdown.distance}分</div>
                            <div class="desc">${breakdown.distanceKm} km · ${breakdown.distanceTip}</div>
                        </div>
                        <div class="score-detail-item">
                            <div class="label">随机因子</div>
                            <div class="value">+${breakdown.random}分</div>
                            <div class="desc">保证计算一致性</div>
                        </div>
                    </div>
                    <div class="score-summary">
                        <div class="label">总分</div>
                        <div class="value">${score}分</div>
                        <div style="margin-top:5px;">${starsHTML}</div>
                    </div>
                `;
            } else {
                // 显示价格计算详情
                document.getElementById('detailContent').innerHTML = `
                    <div style="margin-bottom:15px; padding:15px; background:#f8f9fa; border-radius:10px;">
                        <div style="font-weight:600; color:#333; margin-bottom:5px;">${route.origin.iata_code} → ${route.dest.iata_code}</div>
                        <div style="font-size:14px; color:#666; margin-bottom:8px;">${route.origin.name} 到 ${route.dest.name}</div>
                        <div style="font-size:13px; color:#888;">
                            <div>出发地: ${route.origin.municipality || '未知'}${originCityCn ? ' (' + originCityCn + ')' : ''}, ${route.origin.iso_country || '未知'}${originCountryCn ? ' (' + originCountryCn + ')' : ''}</div>
                            <div>目的地: ${route.dest.municipality || '未知'}${destCityCn ? ' (' + destCityCn + ')' : ''}, ${route.dest.iso_country || '未知'}${destCountryCn ? ' (' + destCountryCn + ')' : ''}</div>
                        </div>
                    </div>
                    <div class="score-detail-grid">
                        <div class="score-detail-item">
                            <div class="label">基础票价</div>
                            <div class="value">¥100</div>
                            <div class="desc">固定基础费用</div>
                        </div>
                        <div class="score-detail-item">
                            <div class="label">距离费用</div>
                            <div class="value">+¥${distanceBasePrice.toFixed(0)}</div>
                            <div class="desc">${route.distance.toFixed(1)} km × ¥0.3/km</div>
                        </div>
                        <div class="score-detail-item">
                            <div class="label">低成本航司折扣</div>
                            <div class="value">${isLccRoute ? '8折' : '无折扣'}</div>
                            <div class="desc">${isLccRoute ? `${route.origin.iata_code}或${route.dest.iata_code}是LCC基地` : '非低成本航司航线'}</div>
                        </div>
                        <div class="score-detail-item">
                            <div class="label">竞争折扣</div>
                            <div class="value">${(competitionDiscount * 100).toFixed(0)}%</div>
                            <div class="desc">机场吞吐量: ${originProps.hub_size}级 | ${destProps.hub_size}级</div>
                        </div>
                        <div class="score-detail-item">
                            <div class="label">随机波动</div>
                            <div class="value">±10%</div>
                            <div class="desc">模拟真实票价波动</div>
                        </div>
                    </div>
                    <div class="score-summary">
                        <div class="label">预估价格</div>
                        <div class="value" style="color:#f44336; font-size:24px;">¥${route.estimatedPrice}</div>
                        <div style="margin-top:5px; font-size:12px; color:#999;">* 价格仅供参考，请以实际查询为准</div>
                    </div>
                `;
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
            currentDetailIndex = -1;
        }

        let routesExpanded = false;

        function viewAllRoutes() {
            if (routesExpanded) {
                displayedRoutesCount = 5;
                routesExpanded = false;
                document.getElementById('viewAllBtn').textContent = `查看全部 (${allRoutes.length})`;
            } else {
                displayedRoutesCount = allRoutes.length;
                routesExpanded = true;
                document.getElementById('viewAllBtn').textContent = '收起部分';
            }
            displayRoutes();
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorToast').classList.add('show');
            setTimeout(() => {
                document.getElementById('errorToast').classList.remove('show');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', loadAirportsData);
    </script>
</body>
</html>
